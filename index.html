<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Authorization</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 2px solid #fff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #050505;
        }
        input {
            background-color: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            outline: none;
            width: 200px;
        }
        button {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <input type="text" id="code-input" maxlength="8" placeholder="00000000" autocomplete="off">
        <button onclick="verifyAndRedirect()">ВОЙТИ</button>
    </div>

    <script>
        function decodeText(encoded) {
            const binary = atob(encoded);
            const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
            return new TextDecoder("utf-8").decode(bytes);
        }

        async function sha256(value) {
            const data = new TextEncoder().encode(value);
            const hash = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, "0")).join("");
        }

        async function verifyAndRedirect() {
            const inputField = document.getElementById("code-input");
            const inputValue = inputField.value.trim();
            if (await sha256(inputValue) === "b4d3a4bb70735f3f9e50204d80295ec240b60c4de71bbc1a375babac00b47f07") {
                window.location.href = decodeText("aHR0cHM6Ly81b20zb25lLmdpdGh1Yi5pby9oZWxsby8=");
            } else {
                alert("ОШИБКА");
                inputField.value = "";
                inputField.focus();
            }
        }
        document.getElementById("code-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyAndRedirect();
            }
        });
    </script>
</body>
</html>
