<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Authorisation</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            border: 2px solid #fff; /* Белая рамка */
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #050505;
        }
        input {
            background-color: #000;
            border: 1px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            outline: none;
            width: 200px;
        }
        button {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <input type="text" id="code-input" maxlength="8" placeholder="00000000" autocomplete="off">
        <button onclick="verifyAndRedirect()">ВОЙТИ</button>
    </div>

    <script>
        function verifyAndRedirect() {
            const inputField = document.getElementById("code-input");
            const inputValue = inputField.value.trim();

            // Прямая и точная проверка кода без сторонних библиотек
            if (inputValue === "53791602") {
                // Если код верный, мгновенно перекидываем на секретный сайт
                window.location.href = "https://5om3one.github.io/hello/";
            } else {
                // Если код неверный — выводим ошибку в стиле старых терминалов
                alert("ОШИБКА ДОСТУПА: НЕВЕРНЫЙ КОД");
                inputField.value = "";
                inputField.focus();
            }
        }

        // Позволяем игроку отправлять код по нажатию клавиши Enter
        document.getElementById("code-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyAndRedirect();
            }
        });
    </script>
</body>
</html>
